# Zero-setup local environment: H2 in-memory database.
# To use local MySQL, set LOCAL_DB_URL, LOCAL_DB_USERNAME, LOCAL_DB_PASSWORD.
spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:h2:mem:mainapi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${LOCAL_DB_USERNAME:sa}
    password: ${LOCAL_DB_PASSWORD:}
  sql:
    init:
      mode: embedded
