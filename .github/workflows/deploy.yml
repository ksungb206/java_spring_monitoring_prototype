name: Deploy monitoring server
on:
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:

permissions:
  contents: read

# One WSL host, but an independent Git checkout and systemd unit per environment.
# Serialize deployments to avoid concurrent Maven/systemd operations.
concurrency:
  group: monitoring-deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, deploy-local]
    environment: ${{ github.ref_name }}
    timeout-minutes: 20
    steps:
      - name: Validate isolated deployment checkout
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in dev|stage|prod) ;; *) echo "Unsupported deployment branch: $DEPLOY_BRANCH"; exit 2 ;; esac
          : "${DEPLOY_ROOT:?Configure DEPLOY_ROOT separately for dev, stage, prod GitHub Environments}"
          [[ -d "$DEPLOY_ROOT/.git" ]] || { echo "Missing isolated Git checkout: $DEPLOY_ROOT. Run scripts/setup-deploy-checkouts.sh from the source workspace first."; exit 1; }
          [[ -f "$DEPLOY_ROOT/scripts/deploy-branch.sh" ]] || { echo "Missing deploy script in checkout: $DEPLOY_ROOT"; exit 1; }
          CHECKOUT_BRANCH="$(git -C "$DEPLOY_ROOT" branch --show-current)"
          [[ "$CHECKOUT_BRANCH" == "$DEPLOY_BRANCH" ]] || { echo "Expected isolated checkout branch $DEPLOY_BRANCH, found $CHECKOUT_BRANCH at $DEPLOY_ROOT"; exit 1; }
          bash "$DEPLOY_ROOT/scripts/deploy-branch.sh" "$DEPLOY_BRANCH"
