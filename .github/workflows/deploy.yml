name: Deploy monitoring server
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, deploy-dev]
    environment: dev
    timeout-minutes: 20
    steps:
      - name: Deploy DEV to the runner's own WSL
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_ROOT" ]]; then DEPLOY_ROOT="$HOME/deploy-checkouts/dev"; fi
          [[ -d "$DEPLOY_ROOT/.git" ]] || { echo "Missing local DEV checkout: $DEPLOY_ROOT. Run scripts/bootstrap-wsl-dev.sh first."; exit 1; }
          [[ "$(git -C "$DEPLOY_ROOT" branch --show-current)" == "dev" ]] || exit 1
          bash "$DEPLOY_ROOT/scripts/deploy-branch.sh" dev
